name: api

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-static:
    name: api-static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://USER:PASSWORD@localhost:5432/studyquest?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm prisma:validate

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: API typecheck
        run: pnpm typecheck:api

      - name: API build
        run: pnpm build:api

  api-db:
    name: api-db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgresql://studyquest_test:studyquest_test@127.0.0.1:5433/studyquest_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyquest_test
          POSTGRES_PASSWORD: studyquest_test
          POSTGRES_DB: studyquest_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U studyquest_test -d studyquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API DB integration tests
        run: pnpm test:api:db
