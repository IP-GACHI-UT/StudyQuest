name: e2e

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authentication-e2e:
    name: authentication-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://studyquest_test:studyquest_test@127.0.0.1:5432/studyquest_test?schema=public
      BETTER_AUTH_SECRET: studyquest-ci-secret-with-at-least-32-characters
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyquest_test
          POSTGRES_PASSWORD: studyquest_test
          POSTGRES_DB: studyquest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyquest_test -d studyquest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.28
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authentication E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
