services:
  db:
    image: postgres:16
    container_name: studyquest-db
    ports:
      - "5432:5432"
    environment:
      # ローカル開発用の固定値です。本番環境では使用しないでください。
      POSTGRES_USER: studyquest
      POSTGRES_PASSWORD: studyquest
      POSTGRES_DB: studyquest
    volumes:
      # コンテナを停止してもローカルDBのデータを保持します。
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyquest -d studyquest"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16
    container_name: studyquest-db-test
    profiles:
      - test
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      # ローカルDB結合テスト専用の固定値です。
      POSTGRES_USER: studyquest_test
      POSTGRES_PASSWORD: studyquest_test
      POSTGRES_DB: studyquest_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyquest_test -d studyquest_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: studyquest-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
