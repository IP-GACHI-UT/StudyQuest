services:
  db:
    image: postgres:16
    container_name: studyquest-db
    ports:
      - "5432:5432"
    environment:
      # Local development only. Do not use these values for production.
      POSTGRES_USER: studyquest
      POSTGRES_PASSWORD: studyquest
      POSTGRES_DB: studyquest
    volumes:
      # Keep local database data after the container stops.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyquest -d studyquest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
