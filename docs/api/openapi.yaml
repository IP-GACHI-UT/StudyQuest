openapi: 3.0.3
info:
  title: StudyQuest MVP API
  version: 0.1.0
  description: |
    StudyQuest MVPで使うAPI仕様です。
    Swagger/OpenAPIをAPI契約書として扱い、フロントエンドとバックエンドの認識を合わせるために使います。
servers:
  - url: http://localhost:3001
    description: ローカルAPI開発環境
security: []
tags:
  - name: Auth
    description: Better Authによる登録、ログイン、メール確認、パスワード再設定
  - name: Quests
    description: クエストの取得と受注に関するAPI
  - name: StudyLogs
    description: 学習記録に関するAPI
  - name: Summary
    description: 学習状況の集計に関するAPI
  - name: Activities
    description: ユーザーの活動と掲示板表示に関するAPI
  - name: Profile
    description: プロフィール表示に関するAPI
paths:
  /api/auth/sign-up/email:
    post:
      tags: [Auth]
      summary: メールアドレスとパスワードで登録する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignUpRequest"
      responses:
        "200":
          description: 登録を受け付け、確認メールを送信しました。
        "400":
          $ref: "#/components/responses/AuthRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/sign-in/email:
    post:
      tags: [Auth]
      summary: メールアドレスとパスワードでログインする
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignInRequest"
      responses:
        "200":
          description: ログインに成功し、session Cookieを設定しました。
        "401":
          $ref: "#/components/responses/AuthRequestError"
        "403":
          $ref: "#/components/responses/AuthRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/sign-in/social:
    post:
      tags: [Auth]
      summary: Google OAuthログインを開始する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialSignInRequest"
      responses:
        "200":
          description: Googleの認可画面URLを返します。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/auth/callback/google:
    get:
      tags: [Auth]
      summary: Google OAuth callbackを処理する
      x-implementation-status: implemented
      responses:
        "302":
          description: 検証後、指定されたサイト内URLへリダイレクトします。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/auth/get-session:
    get:
      tags: [Auth]
      summary: 現在のsessionを取得する
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 有効なsessionとユーザー、またはnullを返します。
  /api/auth/sign-out:
    post:
      tags: [Auth]
      summary: 現在のsessionからログアウトする
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: sessionを失効し、Cookieを削除しました。
  /api/auth/send-verification-email:
    post:
      tags: [Auth]
      summary: メールアドレス確認メールを再送する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendVerificationEmailRequest"
      responses:
        "200":
          description: 確認メールの送信を受け付けました。
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: メールアドレス確認トークンを検証する
      x-implementation-status: implemented
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 確認結果とともに指定されたサイト内URLへリダイレクトします。
  /api/auth/request-password-reset:
    post:
      tags: [Auth]
      summary: パスワード再設定メールを要求する
      description: アカウントの存在にかかわらず同じ成功レスポンスを返します。
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: 再設定メールの送信要求を受け付けました。
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/reset-password/{token}:
    get:
      tags: [Auth]
      summary: パスワード再設定リンクを検証する
      x-implementation-status: implemented
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: 検証結果を付けて再設定画面へリダイレクトします。
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: パスワードを再設定する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: パスワードを変更し、既存sessionをすべて失効しました。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/quests:
    get:
      tags:
        - Quests
      summary: クエスト一覧を取得する
      description: |
        受注できるクエストの一覧を取得します。
        MVPでは有効なクエストだけを返し、画面の「おすすめクエスト」表示に使います。
      x-implementation-status: implemented
      responses:
        "200":
          description: クエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/board/quests:
    get:
      tags:
        - Quests
      summary: 掲示板用クエスト一覧を取得する
      description: |
        掲示板に表示する有効なクエストと、全ユーザーを対象にした集計、現在ユーザーの受注状態を取得します。
        acceptedTodayとcompletedTodayはAPIサーバーのローカル日付における当日分です。
        completionRateは、全期間の受注数に対するcompletedAtが設定された受注数の割合を整数へ四捨五入した値です。
        currentUser.isAcceptedは現在ユーザーのUserQuestが存在する場合にtrueとなり、全体集計からは判定しません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 掲示板用クエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestBoardListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/quests/{questId}/accept:
    post:
      tags:
        - Quests
      summary: クエストを受注する
      description: |
        指定したクエストを現在のユーザーのマイクエストに追加します。
        初回受注時に、クエストのacceptPointをユーザーの累計ポイントへ加算します。
        同じユーザーが同じクエストを重複して受注することはできません。
        重複受注が拒否された場合、受注ポイントは加算されません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: questId
          in: path
          required: true
          description: 受注したいクエストIDです。
          schema:
            type: string
      responses:
        "201":
          description: クエストの受注に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuestResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: 指定されたクエストが存在しません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: すでに同じクエストを受注しています。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/my-quests:
    get:
      tags:
        - Quests
      summary: マイクエストを取得する
      description: |
        現在のユーザーが受注しているクエスト一覧を取得します。
        画面の「いま達成を目指しているクエスト」表示に使います。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: マイクエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyQuestListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/study-logs:
    post:
      tags:
        - StudyLogs
      summary: 学習記録を作成する
      description: |
        受注済みクエストに対して、学習した時間と任意のメモを記録します。
        同じマイクエストに紐づく合計学習時間がクエストの想定時間以上になった場合、そのマイクエストは自動的に達成扱いになります。
        MVPでは学習タイマーや学習完了ボタンから呼び出す想定です。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyLogRequest"
            examples:
              basic:
                summary: 10分学習した例
                value:
                  questId: clxquest001
                  minutes: 10
                  note: 公式ドキュメントの導入部分を読んだ
                  studiedAt: "2026-06-28T10:00:00.000Z"
      responses:
        "201":
          description: 学習記録の作成に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLogResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "400":
          description: 入力内容が不正、またはクエストをまだ受注していません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/study-summary/weekly:
    get:
      tags:
        - Summary
      summary: 今週の学習状況を取得する
      description: |
        現在のユーザーの今週の学習時間、達成クエスト数、獲得XP、今週内での最大連続学習日数を取得します。
        日別の学習時間は月曜始まりの7日分を返し、ログがない日は minutes: 0 を返します。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 今週の学習状況の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyStudySummaryResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/activities:
    get:
      tags:
        - Activities
      summary: ユーザーの活動を取得する
      description: |
        現在のユーザーの活動を新しい順に最大20件取得します。
        ユーザー情報はdisplayNameだけ、クエスト情報はidとtitleだけを返します。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: ユーザーの活動一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/profile:
    get:
      tags:
        - Profile
      summary: プロフィールを取得する
      description: |
        現在のユーザーの名前、レベル、累計ポイント、累計XP、累計学習時間、獲得バッジを取得します。
        パスワードや認証トークンなどの秘密情報は返しません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: プロフィールの取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: studyquest.session_token
      description: Better Authが発行するHttpOnly session Cookie。本番ではSecure属性を付与します。
  responses:
    AuthenticationRequired:
      description: 有効なsessionがありません。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: ログインが必要です。
    AuthRequestError:
      description: Better Authによる認証要求の検証に失敗しました。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    TooManyRequests:
      description: 認証APIの試行回数が上限を超えました。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    InternalServerError:
      description: サーバー内部で予期しないエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    EmailSignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
        callbackURL:
          type: string
          example: /dashboard
    EmailSignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: true
        callbackURL:
          type: string
          example: /dashboard
    SocialSignInRequest:
      type: object
      required: [provider, callbackURL]
      properties:
        provider:
          type: string
          enum: [google]
        callbackURL:
          type: string
          example: /dashboard
        newUserCallbackURL:
          type: string
          example: /dashboard
    SendVerificationEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        callbackURL:
          type: string
          example: /dashboard
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        redirectTo:
          type: string
          example: /reset-password
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 15
          maxLength: 128
    QuestDifficulty:
      type: string
      description: クエストの難易度です。
      enum:
        - easy
        - normal
        - hard
    UserQuestStatus:
      type: string
      description: ユーザーごとのクエスト進捗です。
      enum:
        - in_progress
        - completed
        - canceled
    ActivityType:
      type: string
      description: 活動の種類です。
      enum:
        - quest_accepted
        - quest_completed
        - study_log_created
        - badge_earned
    Quest:
      type: object
      required:
        - id
        - title
        - description
        - category
        - difficulty
        - estimatedMinutes
        - acceptPoint
        - clearPoint
        - xpReward
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: クエストIDです。
        title:
          type: string
          description: クエスト名です。
        description:
          type: string
          description: クエストの説明です。
        category:
          type: string
          description: プログラミング、英語などのカテゴリです。
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        estimatedMinutes:
          type: integer
          minimum: 1
          description: 想定学習時間です。
        acceptPoint:
          type: integer
          description: 受注時にもらえるポイントです。
        clearPoint:
          type: integer
          description: 達成時にもらえるポイントです。
        xpReward:
          type: integer
          description: 達成時にもらえるXPです。
        isActive:
          type: boolean
          description: 現在受注可能かどうかです。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QuestBoardStatistics:
      type: object
      required:
        - acceptedToday
        - completedToday
        - completionRate
      properties:
        acceptedToday:
          type: integer
          minimum: 0
          description: APIサーバーのローカル日付で本日受注された全ユーザーの人数です。
        completedToday:
          type: integer
          minimum: 0
          description: APIサーバーのローカル日付で本日達成した全ユーザーの人数です。
        completionRate:
          type: integer
          minimum: 0
          maximum: 100
          description: 全期間の受注数に対する達成数の割合を整数へ四捨五入した値です。受注がない場合は0です。
    QuestBoardCurrentUser:
      type: object
      required:
        - isAccepted
      properties:
        isAccepted:
          type: boolean
          description: 現在ユーザーのUserQuestが存在するかどうかです。
    QuestBoardItem:
      type: object
      required:
        - quest
        - statistics
        - currentUser
      properties:
        quest:
          $ref: "#/components/schemas/Quest"
        statistics:
          $ref: "#/components/schemas/QuestBoardStatistics"
        currentUser:
          $ref: "#/components/schemas/QuestBoardCurrentUser"
    UserQuest:
      type: object
      required:
        - id
        - status
        - acceptedAt
        - quest
      properties:
        id:
          type: string
          description: ユーザーごとの受注IDです。
        status:
          $ref: "#/components/schemas/UserQuestStatus"
        acceptedAt:
          type: string
          format: date-time
          description: クエストを受注した日時です。
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: クエストを達成した日時です。
        quest:
          $ref: "#/components/schemas/Quest"
    StudyLog:
      type: object
      required:
        - id
        - userId
        - questId
        - minutes
        - studiedAt
        - createdAt
      properties:
        id:
          type: string
          description: 学習記録IDです。
        userId:
          type: string
          description: ユーザーIDです。
        questId:
          type: string
          description: 学習対象のクエストIDです。
        minutes:
          type: integer
          minimum: 1
          description: 学習時間です。
        note:
          type: string
          nullable: true
          description: 任意のメモです。
        studiedAt:
          type: string
          format: date-time
          description: 実際に学習した日時です。
        createdAt:
          type: string
          format: date-time
          description: 記録を作成した日時です。
    Activity:
      type: object
      required:
        - id
        - type
        - message
        - createdAt
        - user
        - quest
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/ActivityType"
        message:
          type: string
          description: 画面に表示する活動内容です。
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          required:
            - displayName
          properties:
            displayName:
              type: string
              description: 活動したユーザーの表示名です。
        quest:
          type: object
          nullable: true
          required:
            - id
            - title
          properties:
            id:
              type: string
              description: 関連するクエストIDです。
            title:
              type: string
              description: 関連するクエスト名です。
    Badge:
      type: object
      required:
        - id
        - name
        - description
        - earnedAt
      properties:
        id:
          type: string
        name:
          type: string
          description: バッジ名です。
        description:
          type: string
          description: バッジの説明です。
        icon:
          type: string
          nullable: true
          description: バッジ表示用のアイコン文字列です。
        earnedAt:
          type: string
          format: date-time
          description: バッジを獲得した日時です。
    QuestListResponse:
      type: object
      required:
        - quests
      properties:
        quests:
          type: array
          items:
            $ref: "#/components/schemas/Quest"
    QuestBoardListResponse:
      type: object
      required:
        - quests
      properties:
        quests:
          type: array
          items:
            $ref: "#/components/schemas/QuestBoardItem"
    UserQuestResponse:
      type: object
      required:
        - userQuest
      properties:
        userQuest:
          $ref: "#/components/schemas/UserQuest"
    MyQuestListResponse:
      type: object
      required:
        - userQuests
      properties:
        userQuests:
          type: array
          items:
            $ref: "#/components/schemas/UserQuest"
    CreateStudyLogRequest:
      type: object
      required:
        - questId
        - minutes
      properties:
        questId:
          type: string
          description: 学習記録を紐づけるクエストIDです。
        minutes:
          type: integer
          minimum: 1
          description: 学習時間です。1以上の整数を指定します。
        note:
          type: string
          description: 任意の学習メモです。
        studiedAt:
          type: string
          format: date-time
          description: 学習した日時です。省略時はAPI実行時刻を使います。
    StudyLogResponse:
      type: object
      required:
        - studyLog
      properties:
        studyLog:
          $ref: "#/components/schemas/StudyLog"
    WeeklyStudySummaryResponse:
      type: object
      required:
        - summary
      properties:
        summary:
          type: object
          required:
            - studyMinutes
            - completedQuestCount
            - earnedXp
            - streakDays
            - dailyStudyMinutes
          properties:
            studyMinutes:
              type: integer
              description: 今週の合計学習時間です。
            completedQuestCount:
              type: integer
