        userId:
          type: string
          description: ユーザーIDです。
        questId:
          type: string
          description: 学習対象のクエストIDです。
        minutes:
          type: integer
          minimum: 1
          description: 学習時間です。
        note:
          type: string
          nullable: true
          description: 任意のメモです。
        studiedAt:
          type: string
          format: date-time
          description: 実際に学習した日時です。
        createdAt:
          type: string
          format: date-time
          description: 記録を作成した日時です。
    Activity:
      type: object
      required:
        - id
        - type
        - message
