          type: string
          format: date-time
        user:
          type: object
          required:
            - displayName
          properties:
            displayName:
              type: string
              description: 活動したユーザーの表示名です。
        quest:
          type: object
          nullable: true
          required:
            - id
            - title
          properties:
            id:
              type: string
              description: 関連するクエストIDです。
            title:
              type: string
              description: 関連するクエスト名です。
    Badge:
      type: object
