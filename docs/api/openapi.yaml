    QuestBoardItem:
      type: object
      required:
        - quest
        - statistics
        - currentUser
      properties:
        quest:
          $ref: "#/components/schemas/Quest"
        statistics:
          $ref: "#/components/schemas/QuestBoardStatistics"
        currentUser:
          $ref: "#/components/schemas/QuestBoardCurrentUser"
    UserQuest:
      type: object
      required:
        - id
