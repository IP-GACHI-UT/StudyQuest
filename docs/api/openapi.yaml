        description:
          type: string
          description: バッジの説明です。
        icon:
          type: string
          nullable: true
          description: バッジ表示用のアイコン文字列です。
        earnedAt:
          type: string
          format: date-time
          description: バッジを獲得した日時です。
    QuestListResponse:
      type: object
      required:
        - quests
      properties:
