openapi: 3.0.3
info:
  title: StudyQuest MVP API
  version: 0.1.0
  description: |
    StudyQuest MVPで使うAPI仕様です。
    Swagger/OpenAPIをAPI契約書として扱い、フロントエンドとバックエンドの認識を合わせるために使います。
    AiQuestsはSTEP 06の設計案（planned）であり、現在のアプリでは提供していません。
servers:
  - url: http://localhost:3001
    description: ローカルAPI開発環境
security: []
tags:
  - name: AiQuests
    description: STEP 06の未提供の生成・編集採用契約。対象分野・事業者・費用上限は確認待ちです。
  - name: Auth
    description: Better Authによる登録、ログイン、メール確認、パスワード再設定
  - name: Quests
    description: クエストの取得と受注に関するAPI
  - name: StudyLogs
    description: 学習記録に関するAPI
  - name: Summary
    description: 学習状況の集計に関するAPI
  - name: Activities
    description: ユーザーの活動と掲示板表示に関するAPI
  - name: Profile
    description: プロフィール表示に関するAPI
paths:
  /api/quest-generations:
    post:
      tags: [AiQuests]
      summary: 目標から今日のクエスト案を生成する（未提供）
      x-implementation-status: planned
      description: |
        Issue #74の契約案。sessionから所有者を決定し、入力のuserIdは受け付けません。
        本人とrequestIdが同じ要求は再実行せず、入力が異なる場合は409です。
        既存の同一入力の再送は保存済み結果を返し、今日からの期限検査・回数予約は初回だけ行います。
        分野・provider・上限・無料βの提供判断が未確定ならAIを呼ばず503です。
        正規化した文字列と実在する日本時間の日付を検査します。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestGenerationRequest"
      responses:
        "201":
          description: 全案を検証・保存しました。同じ要求の成功再送も201です。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestGenerationResponse"
        "202":
          description: 同じ要求が実行中です。GETで再取得し、再生成しません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestGenerationResponse"
        "400":
          $ref: "#/components/responses/AiQuestRequestError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AiQuestRequestError"
        "409":
          $ref: "#/components/responses/AiQuestRequestError"
        "429":
          $ref: "#/components/responses/AiQuestRequestError"
        "502":
          description: AI_PROVIDER_FAILEDまたはAI_INVALID_OUTPUT。案の部分保存・採用はしません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQuestGenerationErrorResponse"
        "503":
          description: AI_UNAVAILABLE。未接続・制限未設定のためproviderを呼びません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: AI_RESULT_UNKNOWN。結果・費用が不明です。同じ要求を再呼び出ししません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQuestGenerationErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/quest-generations/{generationId}:
    parameters:
      - $ref: "#/components/parameters/GenerationId"
    get:
      tags: [AiQuests]
      summary: 本人の保存済み生成状態と案を取得する（未提供）
      x-implementation-status: planned
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 本人の生成記録です。成功時だけdraftsに検証済みの案を入れます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestGenerationResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/AiQuestNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/quest-generations/{generationId}/adoptions:
    parameters:
      - $ref: "#/components/parameters/GenerationId"
    post:
      tags: [AiQuests]
      summary: 本人の一つの案を編集して採用・受注する（未提供）
      x-implementation-status: planned
      description: |
        成功した生成案を一度だけ採用し、個人用Quest・UserQuest・採用記録・活動を
        同じtransactionで作ります。既存の受注APIを再呼び出ししません。
        編集後の時間と採用済み案の合計は生成時のavailableMinutes以下です。
        報酬・category・所有者はサーバーが決め、入力から受け付けません。
        同じ本人/requestId/内容の再送は確定済み201、異なる内容や別要求での重複採用は409です。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdoptGeneratedQuestRequest"
      responses:
        "201":
          description: 個人用Questを採用・受注しました。既存タイマーと学習保存へ進めます。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuestResponse"
        "400":
          $ref: "#/components/responses/AiQuestRequestError"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AiQuestRequestError"
        "404":
          $ref: "#/components/responses/AiQuestNotFound"
        "409":
          $ref: "#/components/responses/AiQuestRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/sign-up/email:
    post:
      tags: [Auth]
      summary: メールアドレスとパスワードで登録する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignUpRequest"
      responses:
        "200":
          description: 登録を受け付け、確認メールを送信しました。
        "400":
          $ref: "#/components/responses/AuthRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/sign-in/email:
    post:
      tags: [Auth]
      summary: メールアドレスとパスワードでログインする
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSignInRequest"
      responses:
        "200":
          description: ログインに成功し、session Cookieを設定しました。
        "401":
          $ref: "#/components/responses/AuthRequestError"
        "403":
          $ref: "#/components/responses/AuthRequestError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/sign-in/social:
    post:
      tags: [Auth]
      summary: Google OAuthログインを開始する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialSignInRequest"
      responses:
        "200":
          description: Googleの認可画面URLを返します。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/auth/callback/google:
    get:
      tags: [Auth]
      summary: Google OAuth callbackを処理する
      x-implementation-status: implemented
      responses:
        "302":
          description: 検証後、指定されたサイト内URLへリダイレクトします。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/auth/get-session:
    get:
      tags: [Auth]
      summary: 現在のsessionを取得する
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 有効なsessionとユーザー、またはnullを返します。
  /api/auth/sign-out:
    post:
      tags: [Auth]
      summary: 現在のsessionからログアウトする
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: sessionを失効し、Cookieを削除しました。
  /api/auth/send-verification-email:
    post:
      tags: [Auth]
      summary: メールアドレス確認メールを再送する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendVerificationEmailRequest"
      responses:
        "200":
          description: 確認メールの送信を受け付けました。
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: メールアドレス確認トークンを検証する
      x-implementation-status: implemented
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 確認結果とともに指定されたサイト内URLへリダイレクトします。
  /api/auth/request-password-reset:
    post:
      tags: [Auth]
      summary: パスワード再設定メールを要求する
      description: アカウントの存在にかかわらず同じ成功レスポンスを返します。
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: 再設定メールの送信要求を受け付けました。
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/reset-password/{token}:
    get:
      tags: [Auth]
      summary: パスワード再設定リンクを検証する
      x-implementation-status: implemented
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: 検証結果を付けて再設定画面へリダイレクトします。
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: パスワードを再設定する
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: パスワードを変更し、既存sessionをすべて失効しました。
        "400":
          $ref: "#/components/responses/AuthRequestError"
  /api/quests:
    get:
      tags:
        - Quests
      summary: クエスト一覧を取得する
      description: |
        受注できるクエストの一覧を取得します。
        MVPでは有効なクエストだけを返し、画面の「おすすめクエスト」表示に使います。
      x-implementation-status: implemented
      responses:
        "200":
          description: クエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/board/quests:
    get:
      tags:
        - Quests
      summary: 掲示板用クエスト一覧を取得する
      description: |
        掲示板に表示する有効なクエストと、全ユーザーを対象にした集計、現在ユーザーの受注状態を取得します。
        acceptedTodayとcompletedTodayは日本時間（Asia/Tokyo）の当日00:00以上、翌日00:00未満の件数です。
        completionRateは、全期間の受注数に対するcompletedAtが設定された受注数の割合を整数へ四捨五入した値です。
        currentUser.isAcceptedは現在ユーザーのUserQuestが存在する場合にtrueとなり、全体集計からは判定しません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 掲示板用クエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestBoardListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/quests/{questId}/accept:
    post:
      tags:
        - Quests
      summary: クエストを受注する
      description: |
        指定したクエストを現在のユーザーのマイクエストに追加します。
        初回受注時に、クエストのacceptPointをユーザーの累計ポイントへ加算します。
        同じユーザーが同じクエストを重複して受注することはできません。
        重複受注が拒否された場合、受注ポイントは加算されません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      parameters:
        - name: questId
          in: path
          required: true
          description: 受注したいクエストIDです。
          schema:
            type: string
      responses:
        "201":
          description: クエストの受注に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuestResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: 指定されたクエストが存在しません。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: すでに同じクエストを受注しています。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/my-quests:
    get:
      tags:
        - Quests
      summary: マイクエストを取得する
      description: |
        現在のユーザーが受注しているクエスト一覧を取得します。
        画面の「いま達成を目指しているクエスト」表示に使います。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: マイクエスト一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyQuestListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/study-logs:
    get:
      tags:
        - StudyLogs
      summary: 本人の学習記録を取得する
      description: |
        現在のユーザーの記録のみを studiedAt 降順、同時刻なら id 降順で返します。
        ログがない場合は空配列を返します。userId等のクライアント指定で対象者は変更しません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 本人の学習記録を取得しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLogListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - StudyLogs
      summary: 学習記録を作成する
      description: |
        受注済みクエストに対して、学習した時間と任意のメモを記録します。
        同じマイクエストに紐づく合計学習時間がクエストの想定時間以上になった場合、そのマイクエストは自動的に達成扱いになります。
        学習タイマーの終了後、確認した整数の分数で保存します。
        任意のrequestId（UUID v4）を同じ内容で再送した場合、同じ記録を201で返し、ログ・活動・報酬を重複作成しません。
        requestIdを省略した場合は毎回別の記録です。別の内容・ユーザーでの再利用は409です。
        requestIdは study- を付けて既存のStudyLog.idに格納し、一意制約とトランザクションで同時送信も防ぎます。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyLogRequest"
            examples:
              basic:
                summary: 10分学習した例
                value:
                  questId: clxquest001
                  minutes: 10
                  note: 公式ドキュメントの導入部分を読んだ
                  studiedAt: "2026-06-28T10:00:00.000Z"
      responses:
        "201":
          description: 学習記録の作成に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLogResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "400":
          description: 入力内容が不正、未受注、またはキャンセル済みです。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 同じrequestIdで異なる記録を保存しようとしました（REQUEST_ID_CONFLICT）。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/study-summary/weekly:
    get:
      tags:
        - Summary
      summary: 今週の学習状況を取得する
      description: |
        現在のユーザーの今週の学習時間、達成クエスト数、獲得XP、今週内での最大連続学習日数を取得します。
        日本時間（Asia/Tokyo）の月曜00:00以上、翌月曜00:00未満を集計します。サーバーのタイムゾーンには依存しません。
        日別の学習時間は日本時間の月曜始まりの7日分を返し、ログがない日は minutes: 0 を返します。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 今週の学習状況の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyStudySummaryResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/activities:
    get:
      tags:
        - Activities
      summary: ユーザーの活動を取得する
      description: |
        現在のユーザーの活動を新しい順に最大20件取得します。
        ユーザー情報はdisplayNameだけ、クエスト情報はidとtitleだけを返します。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: ユーザーの活動一覧の取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/profile:
    get:
      tags:
        - Profile
      summary: プロフィールを取得する
      description: |
        現在のユーザーの名前、レベル、累計ポイント、累計XP、累計学習時間、獲得バッジを取得します。
        パスワードや認証トークンなどの秘密情報は返しません。
      x-implementation-status: implemented
      security:
        - cookieAuth: []
      responses:
        "200":
          description: プロフィールの取得に成功しました。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: サーバーが生成する不透明なID。他人のIDと不存在は同じ404です。
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: studyquest.session_token
      description: Better Authが発行するHttpOnly session Cookie。本番ではSecure属性を付与します。
  responses:
    AiQuestRequestError:
      description: |
        VALIDATION_ERROR（400）、許可Origin以外（403）、REQUEST_ID_CONFLICT /
        DRAFT_ALREADY_ADOPTED / GENERATION_NOT_READY（409）、AI_LIMIT_REACHED（429）。
        入力本文やproviderの生エラーを含めません。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AiQuestNotFound:
      description: GENERATION_NOT_FOUND。他人の生成記録と不存在を区別しません。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthenticationRequired:
      description: 有効なsessionがありません。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: ログインが必要です。
    AuthRequestError:
      description: Better Authによる認証要求の検証に失敗しました。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    TooManyRequests:
      description: 認証APIの試行回数が上限を超えました。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    InternalServerError:
      description: サーバー内部で予期しないエラーが発生しました。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AiQuestGenerationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [generationId]
          properties:
            generationId:
              type: string
              minLength: 1
              description: 本人の保存済み生成ID。同じ要求の再送で初回応答を失った場合も照会先を取得できます。
    AiRequestId:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: UUID v4。内容が同じ再送では同じ値を使います。
    CreateQuestGenerationRequest:
      type: object
      additionalProperties: false
      required: [requestId, domain, goal, deadline, availableMinutes]
      properties:
        requestId:
          $ref: "#/components/schemas/AiRequestId"
        domain:
          type: string
          enum: [programming, certification, english]
          description: 候補の分野コード。試験で選んだ分野だけをサーバーで許可します。選択は確認待ちです。
        goal:
          type: string
          minLength: 1
          maxLength: 500
          description: LF統一・前後trim後の目標。Unicodeコードポイント数。個人情報や秘密情報を含めません。
        deadline:
          type: string
          format: date
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 実在する日付。日本時間の今日以上、90日後以下をサーバーで検査します。
        availableMinutes:
          type: integer
          minimum: 5
          maximum: 120
          description: 今日この一度の生成結果に使える合計時間の提案値。週の時間予算ではありません。
    AiQuestText:
      type: object
      additionalProperties: false
      required: [title, description, estimatedMinutes]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: LF統一・前後trim後。プレーンテキストで表示します。
        description:
          type: string
          minLength: 1
          maxLength: 600
          description: LF統一・前後trim後の具体的な学習行動。
        estimatedMinutes:
          type: integer
          minimum: 5
          maximum: 120
    AiProviderDrafts:
      type: object
      additionalProperties: false
      required: [drafts]
      description: 未接続providerの出力契約。各案の合計時間と重複もサーバーで検査します。
      properties:
        drafts:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/AiQuestText"
    GeneratedQuestDraft:
      type: object
      additionalProperties: false
      required: [draftIndex, title, description, estimatedMinutes, adoptedQuestId]
      properties:
        draftIndex:
          type: integer
          minimum: 1
          maximum: 3
          description: サーバーが保存時に付ける不変の番号。
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 600
        estimatedMinutes:
          type: integer
          minimum: 5
          maximum: 120
        adoptedQuestId:
          type: string
          nullable: true
          description: 未採用はnull。採用後の編集内容は返却されたuserQuestで確認します。
    QuestGenerationResponse:
      type: object
      additionalProperties: false
      required: [generation]
      properties:
        generation:
          type: object
          additionalProperties: false
          required: [id, requestId, domain, goal, deadline, availableMinutes, status, drafts, createdAt, updatedAt]
          properties:
            id:
              type: string
            requestId:
              $ref: "#/components/schemas/AiRequestId"
            domain:
              type: string
              enum: [programming, certification, english]
            goal:
              type: string
              minLength: 1
              maxLength: 500
            deadline:
              type: string
              format: date
            availableMinutes:
              type: integer
              minimum: 5
              maximum: 120
            status:
              type: string
              enum: [running, succeeded, failed, unknown]
            drafts:
              type: array
              maxItems: 3
              description: succeededは1〜3件、それ以外は空配列。合計時間は入力予算以下です。
              items:
                $ref: "#/components/schemas/GeneratedQuestDraft"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdoptGeneratedQuestRequest:
      type: object
      additionalProperties: false
      required: [requestId, draftIndex, title, description, estimatedMinutes]
      properties:
        requestId:
          $ref: "#/components/schemas/AiRequestId"
        draftIndex:
          type: integer
          minimum: 1
          maximum: 3
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 600
        estimatedMinutes:
          type: integer
          minimum: 5
          maximum: 120
          description: 編集後の時間。採用済み案との合計が元の予算以下かtransaction内で検査します。
    EmailSignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 15
          maxLength: 128
        callbackURL:
          type: string
          example: /dashboard
    EmailSignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: true
        callbackURL:
          type: string
          example: /dashboard
    SocialSignInRequest:
      type: object
      required: [provider, callbackURL]
      properties:
        provider:
          type: string
          enum: [google]
        callbackURL:
          type: string
          example: /dashboard
        newUserCallbackURL:
          type: string
          example: /dashboard
    SendVerificationEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        callbackURL:
          type: string
          example: /dashboard
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        redirectTo:
          type: string
          example: /reset-password
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 15
          maxLength: 128
    QuestDifficulty:
      type: string
      description: クエストの難易度です。
      enum:
        - easy
        - normal
        - hard
    UserQuestStatus:
      type: string
      description: ユーザーごとのクエスト進捗です。
      enum:
        - in_progress
        - completed
        - canceled
    ActivityType:
      type: string
      description: 活動の種類です。
      enum:
        - quest_accepted
        - quest_completed
        - study_log_created
        - badge_earned
    Quest:
      type: object
      required:
        - id
        - title
        - description
        - category
        - difficulty
        - estimatedMinutes
        - acceptPoint
        - clearPoint
        - xpReward
        - isActive
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: クエストIDです。
        title:
          type: string
          description: クエスト名です。
        description:
          type: string
          description: クエストの説明です。
        category:
          type: string
          description: プログラミング、英語などのカテゴリです。
        difficulty:
          $ref: "#/components/schemas/QuestDifficulty"
        estimatedMinutes:
          type: integer
          minimum: 1
          description: 想定学習時間です。
        acceptPoint:
          type: integer
          description: 受注時にもらえるポイントです。
        clearPoint:
          type: integer
          description: 達成時にもらえるポイントです。
        xpReward:
          type: integer
          description: 達成時にもらえるXPです。
        isActive:
          type: boolean
          description: 現在受注可能かどうかです。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QuestBoardStatistics:
      type: object
      required:
        - acceptedToday
        - completedToday
        - completionRate
      properties:
        acceptedToday:
          type: integer
          minimum: 0
          description: APIサーバーのローカル日付で本日受注された全ユーザーの人数です。
        completedToday:
          type: integer
          minimum: 0
          description: APIサーバーのローカル日付で本日達成した全ユーザーの人数です。
        completionRate:
          type: integer
          minimum: 0
          maximum: 100
          description: 全期間の受注数に対する達成数の割合を整数へ四捨五入した値です。受注がない場合は0です。
    QuestBoardCurrentUser:
      type: object
      required:
        - isAccepted
